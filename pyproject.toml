[project]
name = "changedetection-mcp"
version = "0.1.0"
description = "MCP server for ChangeDetection.io — AI-native website change monitoring"
authors = [
    {name = "Sam Russell", email = "rusty4444@users.noreply.github.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
changedetection-mcp = "changedetection_mcp.__main__:main"

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
